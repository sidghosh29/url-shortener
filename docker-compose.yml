services:
  postgres:
    image: postgres:17
    container_name: postgres-url-shortener
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: redis-url-shortener
    ports:
      - "6379:6379"
